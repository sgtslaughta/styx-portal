apiVersion: v1
kind: ServiceAccount
metadata:
  name: styx-backend
  namespace: styx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: styx-backend
  namespace: styx
rules:
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares, serverstransports]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: styx-backend
  namespace: styx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: styx-backend
subjects:
  - kind: ServiceAccount
    name: styx-backend
    namespace: styx
---
# Backend resolves cloudflared pod IPs (TUNNEL_PEER_K8S) to trust CF-Connecting-IP.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: styx-cloudflared-pods
  namespace: cloudflared
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: styx-cloudflared-pods
  namespace: cloudflared
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: styx-cloudflared-pods
subjects:
  - kind: ServiceAccount
    name: styx-backend
    namespace: styx
---
# read-only: service discovery + health for docker-local services
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: styx-backend-discovery
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: styx-backend-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: styx-backend-discovery
subjects:
  - kind: ServiceAccount
    name: styx-backend
    namespace: styx
