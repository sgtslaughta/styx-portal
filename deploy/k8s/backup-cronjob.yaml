# Daily consistent SQLite backup onto the styx-backups volume, using the backend
# image (python sqlite3; no extra images). Runs on the backend's node (RWO volume).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: styx-db-backup
  namespace: styx
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          priorityClassName: styx-critical
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels: {app: styx-backend}
          containers:
            - name: backup
              image: ghcr.io/sgtslaughta/styx-backend
              command: [sh, -ec]
              args:
                - |
                  D=$(date +%F)
                  python -c "
                  import sqlite3, sys
                  src = sqlite3.connect('file:/app/data/styx-portal.db?mode=ro', uri=True)
                  dst = sqlite3.connect('/backups/styx-portal-$D.db')
                  src.backup(dst)
                  r = dst.execute('PRAGMA integrity_check').fetchone()[0]
                  dst.close()
                  if r != 'ok':
                      sys.exit('backup integrity_check failed: ' + r)
                  "
                  if [ -f /app/data/secrets.json ]; then
                    cp /app/data/secrets.json "/backups/secrets-$D.json"
                  fi
                  find /backups -type f \( -name 'styx-*' -o -name 'secrets-*' \) -mtime +14 -delete
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: data, mountPath: /app/data, readOnly: true}
                - {name: backups, mountPath: /backups}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: styx-data, readOnly: true}
            - name: backups
              persistentVolumeClaim: {claimName: styx-backups}
