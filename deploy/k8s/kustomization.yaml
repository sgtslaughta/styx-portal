apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - storageclass.yaml
  - priorityclass.yaml
  - pvc.yaml
  - configmap.yaml
  - rbac.yaml
  - instances.yaml
  - backend.yaml
  - frontend.yaml
  - networkpolicy.yaml
  - backup-cronjob.yaml
  - prometheusrule.yaml
# Tag must be >= v2.3.0 (first release with ROUTE_BACKEND=k8s); older tags boot
# healthy but publish no IngressRoutes (404). Check: kubectl -n styx get ingressroutes
images:
  - name: ghcr.io/sgtslaughta/styx-backend
    newTag: "2.5.0"
  - name: ghcr.io/sgtslaughta/styx-frontend
    newTag: "2.5.0"
