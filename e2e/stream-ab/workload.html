<!doctype html>
<!-- Opened inside the seat (firefox --kiosk) by ab.py: long text to scroll,
     a box to type into, and an animation started by F9 / stopped by F10 for the "video" phase. -->
<html><head><meta charset="utf-8"><title>styx-ab-workload</title>
<style>
  body { margin: 0; font: 15px/1.5 sans-serif; background: #fff; color: #111; }
  #type { position: fixed; top: 0; left: 0; right: 0; height: 90px; font: 16px monospace; z-index: 2; }
  #flip { position: fixed; top: 150px; left: 0; width: 200px; height: 200px; background: #000; z-index: 3; }
  /* latency suite: viewport-relative, so frame fractions map to page fractions at any stream size */
  #kflip, #mflip { position: fixed; left: 1vw; width: 8vw; height: 12vh; background: #000; z-index: 3; }
  #kflip { top: 55vh; } #mflip { top: 70vh; }
  .bit { position: fixed; width: 1.2vw; height: 3vh; background: #000; z-index: 3; }
  #cover { position: fixed; inset: 0; background: #fff; z-index: 1; display: none; }
  #blk { position: fixed; width: 14vw; height: 25vh; background: #000; z-index: 4; display: none; left: -300px; top: 0; }
  #anim { position: fixed; right: 20px; bottom: 20px; width: 480px; height: 270px; display: none; z-index: 2; }
  main { padding: 110px 40px 40px 240px; columns: 2; }
  p:nth-child(3n) { color: #b00; } p:nth-child(5n) { color: #06a; }
</style></head>
<body>
<textarea id="type" placeholder="harness types here"></textarea>
<canvas id="anim" width="480" height="270"></canvas>
<div id="cover"></div><div id="blk"></div>
<!-- latency.mjs: F8 / a mouse press / a pointer move to a target steps these through 4 greys; the
     bit rows (key, mouse, motion) show how many such events the page really received, 12-bit binary. -->
<div id="kflip"></div><div id="mflip"></div>
<div id="flip"></div><!-- F8 flips it: the harness times key -> pixels on this square -->
<main id="text"></main>
<script>
const words = "remote desktop streaming crisp text sharp scroll latency jitter bitrate encoder frame queue path capacity".split(" ");
let seed = 1; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const main = document.getElementById("text");
for (let i = 0; i < 400; i++) {
  const p = document.createElement("p");
  p.textContent = i + ". " + Array.from({ length: 40 }, () => words[Math.floor(rnd() * words.length)]).join(" ");
  main.appendChild(p);
}
const c = document.getElementById("anim"), g = c.getContext("2d"); let on = false, t = 0;
function frame() {
  if (!on) return;
  t += 1;
  for (let x = 0; x < 480; x += 8) for (let y = 0; y < 270; y += 8) {
    g.fillStyle = `hsl(${(x + y + t * 4) % 360} 70% ${40 + 20 * Math.sin((x * y + t * 50) / 900)}%)`;
    g.fillRect(x, y, 8, 8);
  }
  requestAnimationFrame(frame);
}
const cover = document.getElementById("cover"), blk = document.getElementById("blk"), mflip = document.getElementById("mflip");
const kflip = document.getElementById("kflip"), GREY = ["#000", "#555", "#aaa", "#fff"];
const count = [0, 0, 0], bits = [];                       // received events: key, mouse, motion
for (let r = 0; r < 3; r++) for (let i = 0; i < 12; i++) {
  const b = document.createElement("div"); b.className = "bit";
  b.style.left = 1 + 1.6 * i + "vw"; b.style.top = 86 + 4 * r + "vh"; document.body.appendChild(b); bits.push(b);
}
function tick(r) {
  count[r]++; for (let i = 0; i < 12; i++) bits[r * 12 + i].style.background = (count[r] >> i) & 1 ? "#fff" : "#000";
  return count[r];
}
let lastT = -1;
const TARGETS = [[0.70, 0.45], [0.80, 0.75]];             // pointer-motion targets, viewport fractions
addEventListener("mousedown", e => {
  if (e.target.id !== "type") mflip.style.background = GREY[tick(1) % 4];   // the harness's focus click is not a sample
});
addEventListener("mousemove", e => {
  blk.style.left = e.clientX - blk.offsetWidth / 2 + "px"; blk.style.top = e.clientY - blk.offsetHeight / 2 + "px";
  const t = TARGETS.findIndex(([x, y]) => Math.abs(e.clientX / innerWidth - x) < 0.004 && Math.abs(e.clientY / innerHeight - y) < 0.004);
  if (t >= 0 && t !== lastT) tick(2);                     // arrivals only: repeats at the same spot are not moves
  lastT = t;
});
const flip = document.getElementById("flip"); let white = false;
addEventListener("keydown", e => {
  if (e.key === "F8") {
    e.preventDefault(); white = !white; flip.style.background = white ? "#fff" : "#000";
    kflip.style.background = GREY[tick(0) % 4]; return;
  }
  // F7 / F6: pointer-motion mode on / off. A white cover hides the text, a black block follows the pointer.
  if (e.key === "F7" || e.key === "F6") {
    e.preventDefault(); const on7 = e.key === "F7";
    cover.style.display = blk.style.display = on7 ? "block" : "none";
    return;
  }
  // F9 starts, F10 stops: explicit, so no state carries between harness runs.
  if (e.key === "F9" || e.key === "F10") {
    e.preventDefault(); const want = e.key === "F9";
    if (want !== on) { on = want; c.style.display = on ? "block" : "none"; if (on) frame(); }
  }
});
</script></body></html>
