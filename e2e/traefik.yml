# e2e Traefik static config: mirrors ../traefik/traefik.yml (file provider over
# the backend-written dynamic dir). websecure exists only because generated
# routers reference it; it is not published.
ping: {}
log:
  level: INFO
accessLog: {}
entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
    http:
      tls: {}
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
