# Name-based reverse proxy stand-in (NPM/Caddy): routes by Host, 404 for any other name.
server {
  listen 80;
  server_name app.proxy.test;
  location = /bounce { return 302 http://app.proxy.test/landing?x=1; }
  location / { proxy_pass http://whoami-url:80; proxy_set_header Host $host; }
}
server { listen 80 default_server; return 404; }
