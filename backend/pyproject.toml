[project]
name = "styx-portal-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel==0.0.38",
    "sqlalchemy==2.0.49",  # pinned: newer sqlmodel/sqlalchemy reject naive datetimes (ban-check 500)
    "pydantic==2.13.4",
    "aiosqlite>=0.20.0",
    "docker>=7.1.0",
    "pydantic-settings>=2.16.2",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "playwright>=1.64.1",
    "pyjwt>=2.13.0",
    "argon2-cffi>=23.1.0",
    "authlib>=1.3.2",
    "cryptography>=43.0.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=0.24.0",
    "ruff==0.15.14",  # pinned: newer rule defaults flag ~390 existing sites
    "aiohttp>=3.14.1",
    "mypy>=2.4.1",
    "bandit>=1.9.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*", "templates*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
# Non-blocking baseline: CI runs mypy with continue-on-error.
# Ratchet plan: clear errors, then flip CI gate to blocking and tighten below.
# disallow_untyped_defs = true   # enable when ratcheting

[tool.bandit]
exclude_dirs = ["tests", ".venv", "data"]
# B101 assert_used is noise in this codebase's test-adjacent helpers
skips = ["B101"]
