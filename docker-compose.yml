networks:
  styx-portal:
    name: styx-portal
    driver: bridge
  # Only cloudflared and Traefik join (never the backend or any instance): its fixed
  # subnet is the only peer range whose CF-Connecting-IP the backend believes.
  styx-tunnel:
    name: styx-tunnel
    driver: bridge
    ipam:
      config:
        - subnet: ${STYX_TUNNEL_SUBNET:-172.31.254.0/28}
  styx-docker:
    name: styx-docker
    internal: true
  # Proxied docker-local services (SP1) are attached here by the backend.
  # Only Traefik joins: app containers cannot reach backend/frontend directly.
  styx-services:
    name: styx-services
    driver: bridge

volumes:
  db-data:
  screenshots:
  traefik-dynamic:
  letsencrypt:
  lan-certs:

services:
  docker-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=1
      - INFO=1
      - EVENTS=1
      - PING=1
      - EXEC=0
      - BUILD=0
      - COMMIT=0
      - SWARM=0
      - SYSTEM=0
    networks:
      - styx-docker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  traefik:
    profiles: ["tunnel"]
    image: traefik:v3.4
    container_name: styx-traefik
    restart: unless-stopped
    # Ports 80/443 ARE published on the host: physical LAN workstations enroll and
    # stream through them (self-signed LAN cert on :443, auto-generated by the
    # backend and pinned in the enrollment command). Because anyone who can reach
    # them bypasses Cloudflare, the backend only believes CF-Connecting-IP when
    # the peer Traefik saw is in the styx-tunnel subnet (cloudflared only;
    # STYX_TUNNEL_SUBNET to override). Firewall them from the internet if you do not use workstations.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/plugins-local:/plugins-local:ro
      - traefik-dynamic:/etc/traefik/dynamic:ro
      - lan-certs:/lan-certs:ro
    networks:
      - styx-portal
      - styx-services
      - styx-tunnel
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  traefik-direct:
    profiles: ["direct"]
    image: traefik:v3.4
    container_name: styx-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - LE_EMAIL=${LE_EMAIL:-}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
    volumes:
      - ./traefik/traefik-direct.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/plugins-local:/plugins-local:ro
      - traefik-dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
      - lan-certs:/lan-certs:ro
    networks:
      - styx-portal
      - styx-services
      - styx-tunnel
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    depends_on:
      - traefik
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    # styx-tunnel only: reaches Traefik (http://styx-traefik:80) and nothing else.
    networks:
      - styx-tunnel

  # Runs as root before the backend to fix volume ownership. Named Docker volumes
  # are created root-owned; the non-root backend (uid 1000) cannot write them on
  # upgrade from a pre-1000 image (symptom: "attempt to write a readonly database"
  # on the first migration). Idempotent — safe on every start, fresh or upgrade.
  volume-init:
    image: busybox:1.36
    command: sh -c "chown -R 1000:1000 /app/data /app/traefik-dynamic /app/data/lan-certs"
    user: "0:0"
    restart: "no"
    volumes:
      - db-data:/app/data
      - screenshots:/app/data/screenshots
      - traefik-dynamic:/app/traefik-dynamic
      - lan-certs:/app/data/lan-certs

  backend:
    # Hosted image (default): `docker compose pull` fetches it from GHCR.
    # Local build: `docker compose up --build` uses the repo-root context (backend/Dockerfile) below.
    image: ${REGISTRY:-ghcr.io/sgtslaughta}/styx-backend:${STYX_TAG:-latest}
    build: {context: ., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    depends_on:
      docker-proxy:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    environment:
      - DOMAIN=${DOMAIN}
      - DATABASE_URL=sqlite+aiosqlite:///./data/styx-portal.db
      - DOCKER_SOCKET=tcp://docker-proxy:2375
      - DOCKER_NETWORK=styx-portal
      - TEMPLATES_DIR=/app/templates
      - JWT_SECRET=${JWT_SECRET:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - DEPLOY_MODE=${DEPLOY_MODE:-tunnel}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      - TUNNEL_PEER_CIDRS=${STYX_TUNNEL_SUBNET:-172.31.254.0/28}
      - DEV_CORS=${DEV_CORS:-false}
      - ENABLE_DOCS=${ENABLE_DOCS:-false}
      - SERVER_LAN_URL=${SERVER_LAN_URL:-}
      - SERVER_CA_PIN=${SERVER_CA_PIN:-}
    volumes:
      - db-data:/app/data
      - screenshots:/app/data/screenshots
      - traefik-dynamic:/app/traefik-dynamic
      - lan-certs:/app/data/lan-certs
      - ./templates:/app/templates:ro
      - ./agent:/app/agent:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    networks:
      - styx-portal
      - styx-docker
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    # Hosted image (default): `docker compose pull` fetches it from GHCR.
    # Local build: `docker compose up --build` uses the ./frontend context below.
    image: ${REGISTRY:-ghcr.io/sgtslaughta}/styx-frontend:${STYX_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - styx-portal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
